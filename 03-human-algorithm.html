<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Human Algorithm</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:system-ui}.top{padding:20px;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:auto;padding:20px}.intro h1{font-size:52px;margin:20px 0 5px}.intro p{color:#aaa}.add{display:flex;gap:8px;margin:25px 0}.add input{flex:1;padding:12px;background:#1b1b1b;color:#fff;border:1px solid #444;border-radius:8px}.add button{padding:12px;border:0;border-radius:8px}.graph{position:relative;height:520px;background:#171717;border:1px solid #333;border-radius:16px;overflow:hidden}.node{position:absolute;padding:10px 13px;background:#eee;color:#111;border-radius:20px;font-weight:700;cursor:grab;user-select:none}.hint{color:#777;font-size:13px;margin-top:10px}.list{margin-top:20px}.item{display:flex;justify-content:space-between;border-bottom:1px solid #292929;padding:12px 0}</style></head><body><div class="top"><b>HUMAN ALGORITHM</b><span>Music discovery, by humans.</span></div><div class="wrap"><div class="intro"><h1>Build your taste.</h1><p>Add artists and connect them. Every connection has a human reason.</p></div><div class="add"><input id="name" placeholder="Artist / album"><button onclick="addNode()">Add node</button><button onclick="connect()">Connect selected</button></div><div class="graph" id="graph"></div><div class="hint">Click two nodes to select them. Click “Connect selected” to create a relationship.</div><div class="list" id="list"></div></div>
<script>let nodes=JSON.parse(localStorage.humanNodes||"[]"), edges=JSON.parse(localStorage.humanEdges||"[]"), selected=[];function render(){graph.innerHTML="";nodes.forEach((n,i)=>{let d=document.createElement("div");d.className="node";d.textContent=n.name;d.style.left=n.x+"%";d.style.top=n.y+"%";d.style.outline=selected.includes(i)?"3px solid #fff":"none";d.onclick=()=>{if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(selected.length<2)selected.push(i);render()};graph.appendChild(d)});list.innerHTML=edges.map(e=>`<div class="item">${nodes[e.a]?.name||"?"} → ${nodes[e.b]?.name||"?"}</div>`).join("")}function addNode(){if(!name.value.trim())return;nodes.push({name:name.value.trim(),x:10+Math.random()*75,y:10+Math.random()*75});localStorage.humanNodes=JSON.stringify(nodes);name.value="";render()}function connect(){if(selected.length!==2)return;edges.push({a:selected[0],b:selected[1]});localStorage.humanEdges=JSON.stringify(edges);selected=[];render()}render();</script></body></html>
