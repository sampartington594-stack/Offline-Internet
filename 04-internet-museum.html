<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Internet Museum</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e8e4dc;color:#181818;font-family:Georgia,serif}.header{max-width:1100px;margin:auto;padding:35px 20px;border-bottom:1px solid #aaa}.header h1{font-size:50px;margin:0}.header p{margin:5px 0;color:#555}.wrap{max-width:1100px;margin:auto;padding:25px 20px}.form{background:#f7f4ee;border:1px solid #bbb;padding:18px;border-radius:8px;display:grid;gap:10px}.form input,.form textarea{padding:10px;border:1px solid #aaa;background:white;font:inherit}.form button{padding:10px;background:#181818;color:white;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;margin-top:25px}.exhibit{background:#f7f4ee;border:1px solid #bbb;padding:16px;min-height:190px;box-shadow:4px 4px #c9c3b7}.num{font-size:12px;color:#777}.exhibit h2{margin:8px 0}.exhibit a{color:#111;word-break:break-all}.tag{display:inline-block;background:#ddd5c8;padding:4px 7px;font-size:12px;margin-top:12px}</style></head><body><header class="header"><h1>The Internet Museum</h1><p>A personal collection of things worth remembering.</p></header><main class="wrap"><div class="form"><input id="title" placeholder="Exhibit title"><input id="url" placeholder="URL"><textarea id="desc" rows="3" placeholder="Why did you save this?"></textarea><button onclick="add()">Add exhibit</button></div><div class="grid" id="grid"></div></main>
<script>let data=JSON.parse(localStorage.internetMuseum||"[]");function render(){grid.innerHTML=data.map((x,i)=>`<article class="exhibit"><div class="num">EXHIBIT #${String(i+1).padStart(3,"0")} · ${x.date}</div><h2>${x.title}</h2>${x.url?`<a href="${x.url}" target="_blank">${x.url}</a>`:""}<p>${x.desc||""}</p><span class="tag">INTERNET</span></article>`).join("")||"<p>No exhibits yet.</p>"}function add(){if(!title.value)return;data.unshift({title:title.value,url:url.value,desc:desc.value,date:new Date().toLocaleDateString("en-AU")});localStorage.internetMuseum=JSON.stringify(data);title.value=url.value=desc.value="";render()}render();</script></body></html>
