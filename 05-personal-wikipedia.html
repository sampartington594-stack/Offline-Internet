<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Wikipedia</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#202122;font-family:Arial,sans-serif}.top{height:55px;border-bottom:1px solid #a2a9b1;display:flex;align-items:center;padding:0 20px;gap:20px}.logo{font-family:Georgia;font-size:22px}.search{flex:1;max-width:500px;padding:8px;border:1px solid #a2a9b1}.layout{display:grid;grid-template-columns:210px 1fr;max-width:1200px;margin:auto}.side{padding:25px 15px;border-right:1px solid #eaecf0;min-height:calc(100vh - 55px)}.side button{display:block;border:0;background:none;padding:7px;text-align:left;width:100%;cursor:pointer}.main{padding:35px;max-width:850px}.main h1{font-family:Georgia;font-weight:normal;font-size:36px;border-bottom:1px solid #a2a9b1;padding-bottom:8px}.editor{display:grid;gap:10px}.editor input,.editor textarea{padding:10px;border:1px solid #a2a9b1}.editor button{width:max-content;padding:9px}.page{margin-top:25px;line-height:1.7}.page h2{font-family:Georgia;border-bottom:1px solid #a2a9b1}.note{background:#f8f9fa;border:1px solid #eaecf0;padding:10px;font-size:13px}</style></head><body><header class="top"><div class="logo">Personal Wikipedia</div><input class="search" id="search" oninput="render()" placeholder="Search your encyclopedia..."></header><div class="layout"><aside class="side"><b>Navigation</b><button onclick="newPage()">Main page</button><button onclick="newPage()">Random page</button><button onclick="focusEditor()">Create page</button><hr><small>PAGES</small><div id="nav"></div></aside><main class="main"><div class="editor"><input id="title" placeholder="Page title"><textarea id="body" rows="7" placeholder="Write your page..."></textarea><button onclick="save()">Publish page</button></div><div id="page"></div></main></div>
<script>let pages=JSON.parse(localStorage.personalWiki||"[]"),current=null;function render(){let q=search.value.toLowerCase();nav.innerHTML=pages.filter(p=>p.title.toLowerCase().includes(q)).map((p,i)=>`<button onclick="load(${i})">${p.title}</button>`).join("");page.innerHTML=pages.filter(p=>p.title.toLowerCase().includes(q)).map(p=>`<article class="page"><h1>${p.title}</h1><p>${p.body.replaceAll("<","&lt;").replace(/\n/g,"<br>")}</p><div class="note">Last edited ${p.date}</div></article>`).join("")||"<p>Nothing here yet. Create your first page.</p>"}function save(){if(!title.value)return;let p={title:title.value,body:body.value,date:new Date().toLocaleString("en-AU")};if(current===null)pages.unshift(p);else pages[current]=p;localStorage.personalWiki=JSON.stringify(pages);current=null;title.value=body.value="";render()}function load(i){current=i;title.value=pages[i].title;body.value=pages[i].body}function newPage(){current=null;title.value=body.value="";focusEditor()}function focusEditor(){title.focus()}render();</script></body></html>
